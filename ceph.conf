
[global]

# Identificador unico do cluster
fsid = 5b30adb0-48e3-45ad-ac9f-4b3c03e0ca9b

# Servidores de monitoramento
mon_initial_members = ceph1,ceph2,ceph3
mon_host = 172.30.0.11,172.30.0.12,172.30.0.13

# Rede de comunicacao
public_network = 172.30.0.0/24
cluster_network = 172.30.0.0/24

# Autenticacao desativada apenas para laboratorio
auth_cluster_required = none
auth_service_required = none
auth_client_required = none

# Replicacao
osd_pool_default_size = 3
osd_pool_default_min_size = 2

# Deteccao e recuperacao de falhas
mon_osd_down_out_interval = 120

# Limites de recursos
osd_memory_target = 268435456
bluestore_block_create = true
bluestore_block_size = 2147483648
