
name: m2-ceph

services:
  ceph1:
    image: quay.io/ceph/ceph:v19
    container_name: ceph1
    hostname: ceph1
    privileged: true
    mem_limit: 1g
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./ceph.conf:/etc/ceph/ceph.conf:ro
      - ./dados/ceph1:/var/lib/ceph
    networks:
      cephnet:
        ipv4_address: 172.30.0.11

  ceph2:
    image: quay.io/ceph/ceph:v19
    container_name: ceph2
    hostname: ceph2
    privileged: true
    mem_limit: 512m
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./ceph.conf:/etc/ceph/ceph.conf:ro
      - ./dados/ceph2:/var/lib/ceph
    networks:
      cephnet:
        ipv4_address: 172.30.0.12

  ceph3:
    image: quay.io/ceph/ceph:v19
    container_name: ceph3
    hostname: ceph3
    privileged: true
    mem_limit: 512m
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./ceph.conf:/etc/ceph/ceph.conf:ro
      - ./dados/ceph3:/var/lib/ceph
    networks:
      cephnet:
        ipv4_address: 172.30.0.13

networks:
  cephnet:
    ipam:
      config:
        - subnet: 172.30.0.0/24
